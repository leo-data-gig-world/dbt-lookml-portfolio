version: 2

models:
  - name: fct_deals
    description: "One row per sold car. Base table for the Looker deals explore."
    config:
      contract:
        enforced: true        # a changed column name or type fails the build

    # Semantic layer (dbt 1.12 spec). An entity or dimension sits on the column
    # it is built from. Simple metrics sit here, next to their model. Metrics
    # built from other metrics live in _metrics.yml.
    semantic_model:
      enabled: true
    agg_time_dimension: sold_at     # every metric below is dated by this column
    columns:
      - name: deal_id
        data_type: varchar
        description: "Primary key. Looker's primary_key depends on this being unique."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: deal
      - name: dealer_id
        data_type: varchar
        description: "Winning dealer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dealers')
                field: dealer_id
        entity:
          type: foreign
          name: dealer
      - name: car
        data_type: varchar
      - name: region
        data_type: varchar
        description: "Seller's region, upper case."
        dimension:
          type: categorical
      - name: acquisition_channel
        data_type: varchar
        description: "Marketing channel that brought the deal in."
        dimension:
          type: categorical
      - name: sold_at
        data_type: timestamp
        granularity: day
        dimension:
          type: time
      - name: final_price_gbp
        data_type: double
      - name: fee_gbp
        data_type: double
        description: "Marketplace fee charged on the deal."
      - name: refund_gbp
        data_type: double
        description: "Fee refunded. Null in the source becomes 0 here."
      - name: net_revenue_gbp
        data_type: double
        description: "Fee earned minus any refund. Row-level rule, so it lives in dbt."
      - name: is_finance
        data_type: boolean
        description: "True if the buyer used finance."
      - name: bid_count
        data_type: bigint
      - name: top_bid_gbp
        data_type: double

    metrics:
      - name: deals
        description: "How many cars were sold."
        type: simple
        agg: count
        expr: deal_id
      - name: gmv
        description: "Total price of the cars sold, in pounds."
        type: simple
        agg: sum
        expr: final_price_gbp
      - name: fees
        description: "Marketplace fees charged, in pounds."
        type: simple
        agg: sum
        expr: fee_gbp
      - name: refunds
        description: "Fees paid back, in pounds."
        type: simple
        agg: sum
        expr: refund_gbp
      - name: net_revenue
        description: "Fees minus refunds, in pounds."
        type: simple
        agg: sum
        expr: net_revenue_gbp
      - name: finance_deals
        description: "How many deals were bought with finance."
        type: simple
        agg: sum_boolean
        expr: is_finance

  - name: fct_bids
    description: "One row per bid. Incremental."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [deal_id, dealer_id, bid_at]
    columns:
      - name: bid_id
        description: "Primary key."
        data_tests: [unique, not_null]
      - name: deal_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_deals')
                field: deal_id

  - name: fct_marketing_spend
    description: "One row per channel per month. Spend and leads."
    semantic_model:
      enabled: true
    agg_time_dimension: spend_month
    columns:
      - name: spend_id
        description: "Primary key (channel plus month)."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: spend
      - name: spend_gbp
        data_tests: [positive_value]
      - name: channel
        description: "Marketing channel, lower case."
        dimension:
          type: categorical
      - name: spend_month
        description: "First day of the month the money was spent in."
        granularity: month
        dimension:
          type: time
    metrics:
      - name: marketing_spend
        description: "Marketing spend, in pounds."
        type: simple
        agg: sum
        expr: spend_gbp
      - name: leads
        description: "How many leads the marketing brought in."
        type: simple
        agg: sum
        expr: leads

  - name: dim_dealers
    description: "One row per dealer, current state."
    semantic_model:
      enabled: true
    columns:
      - name: dealer_id
        description: "Primary key."
        data_tests: [unique, not_null]
        entity:
          type: primary
          name: dealer
      - name: region
        description: "Region the dealer is based in, upper case."
        dimension:
          type: categorical
      - name: plan
        description: "Dealer's plan, gold or silver."
        dimension:
          type: categorical

  # The calendar MetricFlow joins cumulative metrics and offsets to.
  - name: time_spine_daily
    description: "One row per day for the whole of 2026. Only the semantic layer uses it."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

# Looker isn't part of the dbt DAG, because dbt doesn't build it.
# Exposures are labels that show what uses our models. They run nothing, but
# they add the Looker layer to the end of the lineage graph.
# One exposure per LookML model, so you can see which business function breaks.
exposures:
  - name: looker_sales_model
    label: Looker Sales Model
    type: analysis
    maturity: medium
    description: "lookml/models/sales: deals, dealers and bids."
    depends_on: [ref('fct_deals'), ref('fct_bids'), ref('dim_dealers')]
    owner: {name: Analytics Engineering, email: analytics@example.com}

  - name: looker_marketing_model
    label: Looker Marketing Model
    type: analysis
    maturity: medium
    description: "lookml/models/marketing: channel spend against deals."
    depends_on: [ref('fct_marketing_spend'), ref('fct_deals')]
    owner: {name: Analytics Engineering, email: analytics@example.com}

  - name: looker_finance_model
    label: Looker Finance Model
    type: analysis
    maturity: medium
    description: "lookml/models/finance: fees, refunds and revenue."
    depends_on: [ref('fct_deals'), ref('dim_dealers')]
    owner: {name: Analytics Engineering, email: analytics@example.com}

  - name: sales_overview_dashboard
    label: Sales Overview
    type: dashboard
    maturity: medium
    depends_on: [ref('fct_deals'), ref('fct_bids'), ref('dim_dealers')]
    owner: {name: Analytics Engineering, email: analytics@example.com}

  - name: marketing_performance_dashboard
    label: Marketing Performance
    type: dashboard
    maturity: medium
    depends_on: [ref('fct_marketing_spend'), ref('fct_deals')]
    owner: {name: Analytics Engineering, email: analytics@example.com}

  - name: finance_summary_dashboard
    label: Finance Summary
    type: dashboard
    maturity: medium
    depends_on: [ref('fct_deals'), ref('dim_dealers')]
    owner: {name: Analytics Engineering, email: analytics@example.com}
